source /opt/homebrew/Cellar/timidity/2.15.0_3/share/timidity/timidity.cfg

# This MIDI only uses bank 0 melodic programs and drumset 0.
# We pin the exact melodic mappings here so the render stays stable and
# period-appropriate even if the package-provided patch set changes later.

bank 0

# MIDI program 35 is GM Fretless Bass.
35 Tone_000/035_Fretless_Bass.pat

# MIDI program 50 is GM Synth Strings 1; the bundled patch set skips it.
# String Ensemble 1 is the closest late-90s style stand-in available here.
50 Tone_000/048_String_Ensemble_1_Marcato.pat

# MIDI program 99 is GM Atmosphere; Halo Pad is the closest bundled ambient
# pad in this patch set and fits the dreamy late-90s web soundtrack vibe.
99 Tone_000/094_Halo_Pad.pat
