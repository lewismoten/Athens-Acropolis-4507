<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">
<HTML>
<HEAD>
  <TITLE>HTML Text Marquee</TITLE>
  <LINK REL="stylesheet" HREF="index.css?v=20260606">
</HEAD>
<BODY>
<CENTER>
  <DIV CLASS="page-shell">
    <DIV CLASS="panel panel-preview">
      <DIV CLASS="panel-heading">Shoomi's Color Marquee</DIV>
      <DIV CLASS="preview-frame" ID="preview-frame">
        <CANVAS
          ID="marquee-preview-canvas"
          CLASS="marquee-preview-canvas"
          WIDTH="640"
          HEIGHT="92"
        >
          Welcome to Shoomi's marquee maker.
        </CANVAS>
      </DIV>
    </DIV>

    <DIV CLASS="layout-grid">
      <DIV CLASS="editor-stack">
        <FORM CLASS="panel control-panel" ID="marquee-form">
          <DIV CLASS="panel-heading">Controls</DIV>

          <DIV CLASS="subheading">Animation Timing</DIV>

          <DIV CLASS="field-row field-row-2-equal">
            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Display Time</SPAN>
              <INPUT ID="marquee-display-time" CLASS="field-input" TYPE="number" MIN="1" MAX="999" VALUE="100">
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Speed</SPAN>
              <INPUT ID="marquee-animation-speed" CLASS="field-input" TYPE="number" MIN="1" MAX="120" STEP="1" VALUE="20">
            </LABEL>
          </DIV>

          <DIV CLASS="field-row field-row-3-equal">
            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Width</SPAN>
              <INPUT ID="marquee-width" CLASS="field-input" TYPE="number" MIN="120" MAX="1200" VALUE="640">
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Height</SPAN>
              <INPUT ID="marquee-height" CLASS="field-input" TYPE="number" MIN="32" MAX="240" VALUE="92">
            </LABEL>
          <LABEL CLASS="field">
            <SPAN CLASS="field-label">Background</SPAN>
            <INPUT ID="marquee-background" CLASS="field-input field-color" TYPE="color" VALUE="#000066">
          </LABEL>
        </DIV>

        <DIV CLASS="field-row">
          <LABEL CLASS="field">
            <SPAN CLASS="field-label">Message File</SPAN>
            <INPUT ID="sequence-file-name" CLASS="field-input" TYPE="text" VALUE="dreamers.txt">
          </LABEL>
        </DIV>

          <DIV CLASS="field-row field-row-4">
            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Font Size</SPAN>
              <INPUT ID="marquee-font-size" CLASS="field-input" TYPE="number" MIN="10" MAX="72" VALUE="30">
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Font Family</SPAN>
              <INPUT ID="marquee-font-family" CLASS="field-input" TYPE="text" VALUE="Times New Roman, Times, serif">
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Style</SPAN>
              <SELECT ID="marquee-font-style" CLASS="field-input">
                <OPTION VALUE="0">Regular</OPTION>
                <OPTION VALUE="1">Bold</OPTION>
                <OPTION VALUE="2" SELECTED>Italic</OPTION>
                <OPTION VALUE="3">Bold Italic</OPTION>
              </SELECT>
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Default Font Color</SPAN>
              <INPUT ID="marquee-default-color" CLASS="field-input field-color" TYPE="color" VALUE="#ffff66">
            </LABEL>
          </DIV>

          <DIV CLASS="field-row field-row-5">
            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Background Mode</SPAN>
              <SELECT ID="marquee-background-mode" CLASS="field-input">
                <OPTION VALUE="stars" SELECTED>Stars</OPTION>
                <OPTION VALUE="rain">Rain</OPTION>
                <OPTION VALUE="snow">Snow</OPTION>
                <OPTION VALUE="fireflies">Fireflies</OPTION>
                <OPTION VALUE="dust">Dust</OPTION>
                <OPTION VALUE="bubbles">Bubbles</OPTION>
                <OPTION VALUE="bubble-pop">Bubble Pop</OPTION>
                <OPTION VALUE="embers">Embers</OPTION>
                <OPTION VALUE="sparkles">Sparkles</OPTION>
                <OPTION VALUE="fog">Fog</OPTION>
                <OPTION VALUE="comets">Comets</OPTION>
                <OPTION VALUE="matrix">Matrix</OPTION>
              </SELECT>
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Dot Color</SPAN>
              <INPUT ID="marquee-dot-color" CLASS="field-input field-color" TYPE="color" VALUE="#9999ff">
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Dots</SPAN>
              <INPUT ID="marquee-dot-count" CLASS="field-input" TYPE="number" MIN="0" MAX="999" VALUE="50">
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Wave Height</SPAN>
              <INPUT ID="marquee-wave-height" CLASS="field-input" TYPE="number" MIN="0" MAX="24" VALUE="8">
            </LABEL>

            <LABEL CLASS="field">
              <SPAN CLASS="field-label">Background Speed</SPAN>
              <INPUT ID="marquee-background-speed" CLASS="field-input" TYPE="number" MIN="0" MAX="30" STEP="1" VALUE="3">
            </LABEL>
          </DIV>
        </FORM>

        <FORM CLASS="panel sequencing-panel" ID="sequence-form">
          <DIV CLASS="panel-heading">Message File</DIV>
          <DIV CLASS="sequence-grid" ID="sequence-grid">
            <TABLE CLASS="sequence-table">
              <THEAD>
                <TR>
                  <TH>ID</TH>
                  <TH>Enter</TH>
                  <TH>Exit</TH>
                  <TH>Text</TH>
                  <TH>Actions</TH>
                </TR>
              </THEAD>
              <TBODY ID="sequence-grid-body"></TBODY>
            </TABLE>
          </DIV>
        </FORM>
      </DIV>

      <DIV CLASS="panel code-panel">
        <DIV CLASS="panel-heading" ID="generated-file-heading">Generated `dreamers.txt`</DIV>
        <TEXTAREA ID="marquee-code" CLASS="code-output" ROWS="18" READONLY></TEXTAREA>
        <DIV CLASS="button-row">
          <BUTTON ID="copy-code" TYPE="button" CLASS="action-button">Copy Script</BUTTON>
          <SPAN ID="copy-status" CLASS="copy-status"></SPAN>
        </DIV>
        <DIV CLASS="subheading subheading-output">Generated JavaScript + JSON Marquee</DIV>
        <TEXTAREA ID="marquee-html-code" CLASS="code-output code-output-secondary" ROWS="10" READONLY></TEXTAREA>
      </DIV>
    </DIV>
  </DIV>
</CENTER>
<DIV CLASS="modal-shell" ID="row-modal" HIDDEN>
  <DIV CLASS="modal-backdrop" DATA-MODAL-CLOSE="1"></DIV>
  <DIV CLASS="modal-card" ROLE="dialog" ARIA-MODAL="true" ARIA-LABELLEDBY="row-modal-title">
    <DIV CLASS="panel-heading" ID="row-modal-title">Edit Sequence Row</DIV>
    <FORM ID="row-modal-form" CLASS="modal-form">
      <LABEL CLASS="field">
        <SPAN CLASS="field-label">Text</SPAN>
        <TEXTAREA ID="modal-row-text" CLASS="field-input field-textarea" ROWS="4"></TEXTAREA>
      </LABEL>

      <INPUT ID="modal-row-colors" TYPE="hidden">

      <DIV CLASS="field">
        <SPAN CLASS="field-label">Preview</SPAN>
        <DIV ID="modal-row-preview" CLASS="modal-row-preview"></DIV>
      </DIV>

      <DIV CLASS="modal-footer">
        <DIV CLASS="modal-toolbar">
          <BUTTON TYPE="button" ID="modal-color-trigger" CLASS="action-button modal-color-trigger" TITLE="Change selected text color" ARIA-LABEL="Change selected text color"></BUTTON>
          <INPUT ID="modal-row-color-picker" CLASS="modal-color-native-input" TYPE="color" VALUE="#ffff66" TABINDEX="-1" ARIA-HIDDEN="true">
          <BUTTON TYPE="button" ID="modal-undo" CLASS="action-button">Undo</BUTTON>
        </DIV>

        <DIV CLASS="modal-actions">
          <BUTTON TYPE="button" ID="modal-cancel" CLASS="row-button">Cancel</BUTTON>
          <BUTTON TYPE="submit" CLASS="action-button">Save Row</BUTTON>
        </DIV>
      </DIV>
    </FORM>
  </DIV>
</DIV>
<SCRIPT SRC="../dream-marquee.js?v=20260606"></SCRIPT>
<SCRIPT SRC="index.js?v=20260606"></SCRIPT>
</BODY>
</HTML>
